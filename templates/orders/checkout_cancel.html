{% extends "base.html" %}

{% block title %}Pago cancelado — {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl px-4 py-20 text-center sm:px-6 lg:px-8">
  <p class="font-mono text-xs uppercase tracking-[0.2em] text-ink-muted">Pago cancelado</p>
  <h1 class="mt-2 font-display text-3xl font-semibold text-ink">No se ha completado el pago</h1>
  <p class="mt-3 text-ink-muted">
    No te hemos cobrado nada. Tu carrito sigue intacto si quieres volver a intentarlo.
  </p>
  <div class="mt-8 flex justify-center gap-3">
    <a href="{% url 'cart:detail' %}" class="btn-primary">Volver al carrito</a>
    <a href="{% url 'catalog:home' %}" class="btn-secondary">Seguir comprando</a>
  </div>
</section>
{% endblock %}
