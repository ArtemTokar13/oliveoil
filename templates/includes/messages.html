{% if messages %}
  <div class="pointer-events-none fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2 px-4" x-data="{}">
    {% for message in messages %}
      <div x-data="{ show: true }" x-init="setTimeout(() => show = false, 5000)"
           x-show="show" x-transition
           class="pointer-events-auto w-full max-w-sm border px-4 py-3 text-sm shadow-[0_8px_24px_-8px_rgba(0,0,0,0.25)]
                  {% if message.tags == 'error' %}border-red-800 bg-red-50 text-red-900 dark:bg-red-950 dark:text-red-100
                  {% elif message.tags == 'success' %}border-accent-2 bg-surface text-ink
                  {% else %}border-border bg-surface text-ink{% endif %}">
        <div class="flex items-start justify-between gap-3">
          <span>{{ message }}</span>
          <button type="button" @click="show = false" class="text-ink-muted hover:text-ink" aria-label="Cerrar">&times;</button>
        </div>
      </div>
    {% endfor %}
  </div>
{% endif %}
